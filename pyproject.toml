[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casing-verification"
version = "0.1.0"
description = "Verifikasi casing: scan datapart, cek kamera, MATCH / NOT_MATCH."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "numpy>=1.26,<3.0",
  "opencv-python-headless>=4.10,<5.0",
  "psycopg[binary]>=3.2,<4.0",
  "psycopg-pool>=3.2,<4.0",
  "openvino>=2025.2,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "ruff>=0.5"]
# Hanya untuk konversi .pt -> OpenVINO di PC admin/training (menarik PyTorch, GB).
konversi = ["ultralytics>=8.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ui" = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: butuh PostgreSQL uji (env CASING_TEST_DATABASE_URL)",
  "kamera_nyata: butuh kamera USB asli",
  "model_nyata: butuh model OpenVINO asli (env CASING_TEST_MODEL_XML)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Fixture pytest yang diimpor lalu dipakai sebagai argumen terlihat seperti redefinisi (F811).
"tests/**" = ["F811", "E501"]
# Skrip spike mencetak tabel/format panjang.
"tools/**" = ["E501"]
