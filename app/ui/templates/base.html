<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ judul }}</title>
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/siklus.css">
  <link rel="stylesheet" href="/static/css/kamera.css">
  <link rel="stylesheet" href="/static/css/auth.css">
  <link rel="stylesheet" href="/static/css/model.css">
  <link rel="stylesheet" href="/static/css/hasil.css">
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="bar">
    <h1><span class="logo" aria-hidden="true"></span>Verifikasi Casing</h1>
    <div class="bar-kanan">
      <span id="status-sse" class="status status-putus" role="status">SSE: terputus</span>
      {% block bar_sesi %}{% endblock %}
      <button id="tombol-tema" type="button" class="tombol" aria-label="Ganti tema">Tema</button>
    </div>
  </header>
  {% block banner %}
  <div id="banner-pemindai" class="banner banner-peringatan" role="alert" hidden>
    Pemindai tidak aktif — klik jendela ini agar scan terbaca.
  </div>
  {% endblock %}
  <main class="konten">
    {% block content %}{% endblock %}
  </main>
  <script type="application/json" id="konfig-scan">{{ (konfig_scan or {}) | tojson }}</script>
  <script src="/static/js/events.js" defer></script>
  <script src="/static/js/scan_capture.js" defer></script>
  <script src="/static/js/siklus.js" defer></script>
</body>
</html>
